<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#68150f">
  <title>Mumbai Prints - Customer Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --mp-maroon: #68150f; --mp-maroon-dark: #4e0e09; --mp-orange: #eb4d26; --mp-bg: #fdf8f6; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--mp-bg); }
    .bg-mp-maroon { background-color: var(--mp-maroon); }
    .bg-mp-maroon-dark { background-color: var(--mp-maroon-dark); }
    .bg-mp-orange { background-color: var(--mp-orange); }
    .text-mp-maroon { color: var(--mp-maroon); }
    .text-mp-orange { color: var(--mp-orange); }
    .border-mp-orange { border-color: var(--mp-orange); }
  </style>
</head>
<body class="min-h-screen pb-24 text-slate-800">

  <!-- HEADER -->
  <header class="bg-mp-maroon text-white shadow-md border-b-4 border-mp-orange sticky top-0 z-40">
    <div class="max-w-xl mx-auto p-3.5 flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <div class="bg-white text-mp-maroon font-black text-lg px-2 py-0.5 rounded border-2 border-mp-orange shadow">MP</div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg font-black uppercase leading-none">Mumbai Prints</h1>
            <span id="custCloudBadge" class="text-[10px] bg-emerald-700 text-white font-bold px-2 py-0.5 rounded-full">🔄 Connecting...</span>
          </div>
          <p class="text-[10px] text-orange-200 uppercase tracking-widest mt-0.5">QSP is our USP</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="showAddToHomeScreenGuide()" class="bg-mp-orange text-white text-[11px] font-bold px-2.5 py-1 rounded-lg shadow">📲 Install App</button>
      </div>
    </div>
  </header>

  <!-- FIRST-TIME JOIN / INVITE SCREEN -->
  <section id="customerJoinSection" class="hidden max-w-md mx-auto mt-8 p-4">
    <div class="bg-white rounded-2xl shadow-xl border-2 border-orange-200 overflow-hidden">
      <div class="bg-mp-maroon text-white p-5 text-center border-b-4 border-mp-orange">
        <div class="w-12 h-12 bg-white text-mp-maroon font-black text-xl rounded-xl mx-auto flex items-center justify-center border-2 border-mp-orange mb-2">MP</div>
        <h2 class="text-lg font-black uppercase">Mumbai Prints Exclusive Catalog</h2>
        <p class="text-xs text-orange-200 mt-0.5">One-time registration • Direct wholesale access</p>
      </div>
      <div class="p-5 space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 uppercase mb-1">1. Your Shop / Customer Name *</label>
          <input type="text" id="joinCustName" placeholder="XYZ Textile" class="w-full border-2 border-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:border-mp-orange">
        </div>
        <div>
          <label class="block font-bold text-slate-700 uppercase mb-1">2. Mobile Number (10 Digits) *</label>
          <input type="tel" id="joinCustPhone" placeholder="8893173438" class="w-full border-2 border-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:border-mp-orange">
        </div>
        <div>
          <label class="block font-bold text-slate-700 uppercase mb-1">3. Your Place / City *</label>
          <select id="joinCustPlaceSelect" onchange="toggleCustomPlaceInput()" class="w-full border-2 border-slate-200 rounded-lg p-2.5 text-sm font-semibold bg-orange-50/50 focus:outline-none">
            <option value="Ernakulam">Ernakulam</option>
            <option value="Tamil Nadu">Tamil Nadu</option>
            <option value="Kottayam">Kottayam</option>
            <option value="Alappuzha">Alappuzha</option>
            <option value="OTHER_CUSTOM">Other Place / City...</option>
          </select>
          <input type="text" id="joinCustPlaceCustom" placeholder="Enter your city name" class="hidden mt-2 w-full border-2 border-orange-300 rounded-lg p-2.5 text-sm">
        </div>
        <button id="joinNowBtn" onclick="submitCustomerJoinNow()" class="w-full bg-mp-maroon hover:bg-mp-maroon-dark text-white font-black py-3.5 rounded-xl shadow-md text-sm uppercase tracking-wider">
          Join Now →
        </button>
      </div>
    </div>
  </section>

  <!-- CUSTOMER MAIN VIEW -->
  <main id="customerMainWorkspace" class="hidden max-w-xl mx-auto p-3.5"></main>

  <!-- WHATSAPP-STYLE 4 BOTTOM NAVIGATION TABS -->
  <nav id="customerBottomNav" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t-2 border-orange-200 shadow-2xl z-40">
    <div class="max-w-md mx-auto grid grid-cols-4 gap-1 p-1.5 text-center">
      <button onclick="switchCustomerTab('chat')" id="custNav_chat" class="py-2 px-1 rounded-xl flex flex-col items-center justify-center bg-orange-100 text-mp-maroon font-black text-[11px]">
        <span class="text-lg leading-none mb-0.5">💬</span>
        <span>Chat</span>
      </button>
      <button onclick="switchCustomerTab('folders')" id="custNav_folders" class="py-2 px-1 rounded-xl flex flex-col items-center justify-center text-slate-500 font-bold text-[11px]">
        <span class="text-lg leading-none mb-0.5">📂</span>
        <span>Folders</span>
      </button>
      <button onclick="switchCustomerTab('favorites')" id="custNav_favorites" class="py-2 px-1 rounded-xl flex flex-col items-center justify-center text-slate-500 font-bold text-[11px]">
        <span class="text-lg leading-none mb-0.5">❤️</span>
        <span>Favorite Items</span>
      </button>
      <button onclick="switchCustomerTab('about')" id="custNav_about" class="py-2 px-1 rounded-xl flex flex-col items-center justify-center text-slate-500 font-bold text-[11px]">
        <span class="text-lg leading-none mb-0.5">ℹ️</span>
        <span>About Us</span>
      </button>
    </div>
  </nav>

  <script>
    const FB_URL = "https://mumbai-prints-default-rtdb.firebaseio.com/mp_cloud_db_2026.json";
    const STORAGE_KEY = 'mumbai_prints_master_db_v1';
    const CUST_SESSION_KEY = 'mp_logged_in_customer_v1';

    const defaultDB = {
      folders: ['Ajrakh Print', 'DJ Material', '3D Print', 'DCM', '320 Cut', '3 Meter Cut'],
      categories: {
        cat1: { id: 'cat1', name: 'Category 1', place: 'Ernakulam', buyerIds: ['b_9847011223'] },
        cat2: { id: 'cat2', name: 'Category 2', place: 'Tamil Nadu', buyerIds: ['b_9840055667'] },
        cat3: { id: 'cat3', name: 'Category 3', place: 'Kottayam', buyerIds: ['b_9447088990'] },
        cat4: { id: 'cat4', name: 'Category 4', place: 'Alappuzha', buyerIds: ['b_9446033441'] },
        catX: { id: 'catX', name: 'Category X', place: 'Other Places', buyerIds: [] }
      },
      buyers: {
        b_9847011223: { id: 'b_9847011223', name: 'Kochi Fashion Hub', phone: '9847011223', place: 'Ernakulam', nickname: 'Salim (Kochi)', catKey: 'cat1', isFav: true }
      },
      chats: {
        b_9847011223: [{ msgId: 'm_init_1', from: 'shop', sender: 'Mumbai Prints', text: 'Welcome to Mumbai Prints! Browse our folders and send your order quantities anytime.', time: '10:00 AM', ts: 1700000000000 }]
      },
      orders: [],
      designs: [
        { id: 1, folder: 'Ajrakh Print', title: 'Ajrakh Pure Cotton #1', dateGroup: 'Today — 29 Oct 2026', targetCat: 'all', targetLabel: 'All Categories', img: 'https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=500&q=80', favBy: {} }
      ],
      aboutUs: {
        phone1: '8893173438',
        phone2: '',
        email: 'mumbaiprint18@gmail.com',
        instagram: 'https://instagram.com/mumbaiprints',
        message: 'Thank you so much for showing your trust in us. We will always stand by your side to support you. Thank you so much!'
      }
    };

    let db = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultDB;
    let currentCustomer = JSON.parse(localStorage.getItem(CUST_SESSION_KEY)) || null;
    let activeCustTab = 'chat';
    let selectedCustFolder = (db.folders && db.folders[0]) || 'Ajrakh Print';

    let cloudReady = false;
    let isSyncing = false;
    let lastCloudString = "";

    // Canonical Buyer ID based on 10-digit phone number
    function getCanonicalBuyerId(phone) {
      const clean = String(phone || '').replace(/\D/g, '').slice(-10);
      return clean.length === 10 ? ('b_' + clean) : ('b_' + Date.now());
    }

    function matchPlaceToCategoryInDB(placeStr, refDB) {
      const target = refDB || db;
      const p = (placeStr || '').trim().toLowerCase();
      for (let key of Object.keys(target.categories || {})) {
        if (key !== 'catX' && (target.categories[key].place || '').toLowerCase() === p) {
          return key;
        }
      }
      return target.categories['catX'] ? 'catX' : Object.keys(target.categories)[0];
    }

    function normalizeAndMigrateDB(targetDB) {
      if (!targetDB || typeof targetDB !== 'object') return defaultDB;
      if (!targetDB.categories) targetDB.categories = JSON.parse(JSON.stringify(defaultDB.categories));
      if (!targetDB.buyers) targetDB.buyers = {};
      if (!targetDB.chats) targetDB.chats = {};
      if (!targetDB.orders) targetDB.orders = [];
      if (!targetDB.folders || targetDB.folders.length === 0) targetDB.folders = [...defaultDB.folders];
      if (!targetDB.designs) targetDB.designs = [];
      if (!targetDB.aboutUs) targetDB.aboutUs = JSON.parse(JSON.stringify(defaultDB.aboutUs));

      const idMap = {};
      const newBuyers = {};
      Object.values(targetDB.buyers).forEach(b => {
        if (!b || !b.phone) return;
        const cleanPhone = String(b.phone).replace(/\D/g, '').slice(-10);
        if (cleanPhone.length !== 10) return;
        const canonId = 'b_' + cleanPhone;
        idMap[b.id] = canonId;
        newBuyers[canonId] = Object.assign({}, newBuyers[canonId] || {}, b, { id: canonId, phone: cleanPhone });
      });
      targetDB.buyers = newBuyers;

      const newChats = {};
      Object.keys(targetDB.chats).forEach(oldId => {
        const canonId = idMap[oldId] || oldId;
        const list = targetDB.chats[oldId] || [];
        if (!newChats[canonId]) newChats[canonId] = [];
        const seen = new Set(newChats[canonId].map(m => m.msgId || (m.sender + '|' + m.text + '|' + m.time)));
        list.forEach((m, idx) => {
          if (!m.msgId) m.msgId = 'm_' + (m.ts || idx) + '_' + String(m.text).slice(0, 10);
          const key = m.msgId || (m.sender + '|' + m.text + '|' + m.time);
          if (!seen.has(key)) {
            seen.add(key);
            newChats[canonId].push(m);
          }
        });
      });
      targetDB.chats = newChats;

      targetDB.orders.forEach(o => {
        if (o.buyerId && idMap[o.buyerId]) o.buyerId = idMap[o.buyerId];
        else if (o.buyerPhone) o.buyerId = getCanonicalBuyerId(o.buyerPhone);
      });

      Object.keys(targetDB.categories).forEach(k => {
        targetDB.categories[k].buyerIds = [];
      });
      Object.values(targetDB.buyers).forEach(b => {
        const catK = (b.catKey && targetDB.categories[b.catKey]) ? b.catKey : matchPlaceToCategoryInDB(b.place, targetDB);
        b.catKey = catK;
        if (!targetDB.categories[catK].buyerIds.includes(b.id)) {
          targetDB.categories[catK].buyerIds.push(b.id);
        }
      });

      return targetDB;
    }

    function mergeDatabases(localDB, cloudDB) {
      const l = normalizeAndMigrateDB(JSON.parse(JSON.stringify(localDB || defaultDB)));
      const c = normalizeAndMigrateDB(JSON.parse(JSON.stringify(cloudDB || defaultDB)));
      const merged = JSON.parse(JSON.stringify(c));

      merged.folders = Array.from(new Set([...(c.folders || []), ...(l.folders || [])]));
      merged.categories = Object.assign({}, l.categories, c.categories);

      merged.buyers = Object.assign({}, l.buyers, c.buyers);
      Object.keys(l.buyers || {}).forEach(id => {
        if (c.buyers && c.buyers[id]) {
          merged.buyers[id] = Object.assign({}, c.buyers[id], l.buyers[id]);
          if (c.buyers[id].nickname && !l.buyers[id].nickname) merged.buyers[id].nickname = c.buyers[id].nickname;
        }
      });

      merged.chats = {};
      const allChatBuyerIds = new Set([...Object.keys(l.chats || {}), ...Object.keys(c.chats || {})]);
      allChatBuyerIds.forEach(bId => {
        const combined = [...(c.chats?.[bId] || []), ...(l.chats?.[bId] || [])];
        const uniqueMap = new Map();
        combined.forEach((m, idx) => {
          const key = m.msgId || `${m.from}_${m.sender}_${m.text}_${m.time}`;
          if (!uniqueMap.has(key)) uniqueMap.set(key, m);
        });
        const arr = Array.from(uniqueMap.values());
        arr.sort((a, b) => (a.ts || 0) - (b.ts || 0));
        merged.chats[bId] = arr;
      });

      const orderMap = new Map();
      [...(c.orders || []), ...(l.orders || [])].forEach(o => {
        if (o && o.id) orderMap.set(String(o.id), o);
      });
      merged.orders = Array.from(orderMap.values()).sort((a, b) => (b.ts || 0) - (a.ts || 0));

      const designMap = new Map();
      [...(c.designs || []), ...(l.designs || [])].forEach(d => {
        if (d && d.id) {
          const existing = designMap.get(String(d.id));
          if (existing) d.favBy = Object.assign({}, existing.favBy || {}, d.favBy || {});
          designMap.set(String(d.id), d);
        }
      });
      merged.designs = Array.from(designMap.values());

      return normalizeAndMigrateDB(merged);
    }

    function setCustSyncBadge(text, bg) {
      const b = document.getElementById('custCloudBadge');
      if (b) {
        b.innerText = text;
        b.className = `text-[10px] ${bg} text-white font-bold px-2 py-0.5 rounded-full`;
      }
    }

    async function saveDB() {
      db = normalizeAndMigrateDB(db);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {}
      await pushToCloudSafe();
    }

    async function pushToCloudSafe() {
      if (isSyncing) return;
      isSyncing = true;
      setCustSyncBadge('⬆️ Sending...', 'bg-amber-600');
      try {
        const res = await fetch(FB_URL + "?t=" + Date.now(), { cache: "no-store" });
        if (res.ok) {
          const cloudWrapper = await res.json();
          if (cloudWrapper && cloudWrapper[STORAGE_KEY]) {
            const cloudDB = JSON.parse(cloudWrapper[STORAGE_KEY]);
            db = mergeDatabases(db, cloudDB);
          }
        }
        const finalStr = JSON.stringify(db);
        try { localStorage.setItem(STORAGE_KEY, finalStr); } catch (e) {}
        lastCloudString = finalStr;

        await fetch(FB_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ [STORAGE_KEY]: finalStr, updatedAt: Date.now() })
        });
        setCustSyncBadge('🟢 Online', 'bg-emerald-700');
      } catch (e) {
        setCustSyncBadge('⚠️ Offline', 'bg-red-700');
      }
      isSyncing = false;
    }

    async function forceCloudPull() {
      if (isSyncing) return;
      isSyncing = true;
      try {
        const res = await fetch(FB_URL + "?t=" + Date.now(), { cache: "no-store" });
        if (res.ok) {
          const cloudWrapper = await res.json();
          if (cloudWrapper && cloudWrapper[STORAGE_KEY]) {
            const cloudStr = cloudWrapper[STORAGE_KEY];
            if (cloudStr !== lastCloudString || !cloudReady) {
              const oldDB = JSON.parse(JSON.stringify(db));
              const cloudDB = JSON.parse(cloudStr);
              db = mergeDatabases(db, cloudDB);
              const mergedStr = JSON.stringify(db);
              try { localStorage.setItem(STORAGE_KEY, mergedStr); } catch (e) {}

              if (cloudReady && currentCustomer) {
                const myId = getCanonicalBuyerId(currentCustomer.phone);
                const oldMyChats = (oldDB.chats && oldDB.chats[myId]) || [];
                const newMyChats = (db.chats && db.chats[myId]) || [];
                if (newMyChats.length > oldMyChats.length) {
                  const lastMsg = newMyChats[newMyChats.length - 1];
                  if (lastMsg.from === "shop") {
                    showCustomerNotification("New Reply from Mumbai Prints", `💬 "${lastMsg.text}"`, "chat");
                  }
                } else if ((db.designs || []).length > (oldDB.designs || []).length) {
                  showCustomerNotification("New Designs Uploaded!", "✨ Tap here to check out the latest textile collection.", "folders");
                }
              }

              lastCloudString = mergedStr;

              const activeEl = document.activeElement;
              const isTyping = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'SELECT');
              if (!isTyping && currentCustomer) {
                renderCustomerTab();
              }
            }
          }
        }
        cloudReady = true;
        setCustSyncBadge('🟢 Online', 'bg-emerald-700');
      } catch (e) {
        cloudReady = true;
        setCustSyncBadge('⚠️ Retry', 'bg-red-700');
      }
      isSyncing = false;
    }

    function playNotificationSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1174.66, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.35, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.45);
      } catch (e) {}
    }

    function showCustomerNotification(title, body, targetTab) {
      playNotificationSound();
      if ("Notification" in window && Notification.permission === "granted") {
        try {
          const n = new Notification(title, { body: body });
          n.onclick = function() {
            window.focus();
            if (targetTab) switchCustomerTab(targetTab);
            this.close();
          };
        } catch (e) {}
      }
      const toast = document.createElement("div");
      toast.style.cssText = "position:fixed;top:16px;right:16px;background:#68150f;color:#fff;padding:14px 18px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,0.4);z-index:999999;font-family:sans-serif;font-size:13px;max-width:320px;border:2px solid #ffcc00;cursor:pointer;";
      toast.innerHTML = `
        <div style="font-weight:bold;font-size:14px;color:#ffcc00;margin-bottom:4px;">🔔 ${title}</div>
        <div style="font-size:12px;line-height:1.4;">${body}</div>
        <div style="font-size:10px;color:#ffd54f;margin-top:6px;font-weight:bold;text-transform:uppercase;">👉 Tap here to view</div>
      `;
      toast.onclick = function() {
        if (targetTab) switchCustomerTab(targetTab);
        toast.remove();
      };
      document.body.appendChild(toast);
      setTimeout(() => { if (toast.parentNode) toast.remove(); }, 6500);
    }

    if ("Notification" in window && Notification.permission === "default") {
      document.addEventListener("click", function reqPerm() {
        Notification.requestPermission();
        document.removeEventListener("click", reqPerm);
      }, { once: true });
    }

    function toggleCustomPlaceInput() {
      const sel = document.getElementById('joinCustPlaceSelect').value;
      document.getElementById('joinCustPlaceCustom').classList.toggle('hidden', sel !== 'OTHER_CUSTOM');
    }

    async function initCustomerApp() {
      await forceCloudPull();

      const params = new URLSearchParams(window.location.search);
      const urlName = (params.get('name') || '').trim();
      const urlPhone = (params.get('phone') || '').replace(/\D/g, '').slice(-10);
      const urlPlace = (params.get('place') || '').trim();

      if (urlName) document.getElementById('joinCustName').value = urlName;
      if (urlPhone) document.getElementById('joinCustPhone').value = urlPhone;
      if (urlPlace) {
        const mainPlaces = ['Ernakulam', 'Tamil Nadu', 'Kottayam', 'Alappuzha'];
        const match = mainPlaces.find(p => p.toLowerCase() === urlPlace.toLowerCase());
        if (match) {
          document.getElementById('joinCustPlaceSelect').value = match;
        } else {
          document.getElementById('joinCustPlaceSelect').value = 'OTHER_CUSTOM';
          document.getElementById('joinCustPlaceCustom').classList.remove('hidden');
          document.getElementById('joinCustPlaceCustom').value = urlPlace;
        }
      }

      // Auto-register & auto-login if URL has a valid 10-digit phone number!
      if (urlPhone.length === 10) {
        const canonId = getCanonicalBuyerId(urlPhone);
        const existing = db.buyers[canonId];
        const finalName = urlName || (existing && existing.name) || 'Valued Partner';
        const finalPlace = urlPlace || (existing && existing.place) || 'Ernakulam';
        const catK = (existing && existing.catKey) || matchPlaceToCategoryInDB(finalPlace, db);

        db.buyers[canonId] = {
          id: canonId,
          name: finalName,
          phone: urlPhone,
          place: finalPlace,
          nickname: (existing && existing.nickname) || '',
          catKey: catK,
          isFav: (existing && existing.isFav) || false
        };
        if (!db.chats[canonId] || db.chats[canonId].length === 0) {
          db.chats[canonId] = [{
            msgId: 'm_welcome_' + urlPhone,
            from: 'shop',
            sender: 'Mumbai Prints',
            text: `Welcome ${finalName} to the Mumbai Prints Exclusive Digital Catalog!`,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            ts: Date.now()
          }];
        }
        currentCustomer = db.buyers[canonId];
        localStorage.setItem(CUST_SESSION_KEY, JSON.stringify(currentCustomer));
        await saveDB();
      }

      // Ensure existing session uses canonical phone ID
      if (currentCustomer && currentCustomer.phone) {
        const cleanPhone = String(currentCustomer.phone).replace(/\D/g, '').slice(-10);
        const canonId = getCanonicalBuyerId(cleanPhone);
        currentCustomer.id = canonId;
        if (!db.buyers[canonId]) {
          db.buyers[canonId] = currentCustomer;
          await saveDB();
        } else {
          currentCustomer = db.buyers[canonId];
        }
        localStorage.setItem(CUST_SESSION_KEY, JSON.stringify(currentCustomer));
      }

      if (currentCustomer && currentCustomer.id && db.buyers[currentCustomer.id]) {
        document.getElementById('customerJoinSection').classList.add('hidden');
        document.getElementById('customerMainWorkspace').classList.remove('hidden');
        document.getElementById('customerBottomNav').classList.remove('hidden');
        renderCustomerTab();
      } else {
        document.getElementById('customerJoinSection').classList.remove('hidden');
        document.getElementById('customerMainWorkspace').classList.add('hidden');
        document.getElementById('customerBottomNav').classList.add('hidden');
      }
    }

    async function submitCustomerJoinNow() {
      const name = document.getElementById('joinCustName').value.trim();
      const rawPhone = document.getElementById('joinCustPhone').value.trim();
      const phone = rawPhone.replace(/\D/g, '').slice(-10);
      const selPlace = document.getElementById('joinCustPlaceSelect').value;
      const place = (selPlace === 'OTHER_CUSTOM')
        ? document.getElementById('joinCustPlaceCustom').value.trim()
        : selPlace;

      if (!name || phone.length !== 10 || !place) {
        alert('Please enter your Shop Name, valid 10-Digit Mobile Number, and Place.');
        return;
      }

      const btn = document.getElementById('joinNowBtn');
      if (btn) { btn.innerText = 'Joining & Syncing...'; btn.disabled = true; }

      await forceCloudPull();

      const canonId = getCanonicalBuyerId(phone);
      const existing = db.buyers[canonId];
      const matchedCatKey = (existing && existing.catKey) || matchPlaceToCategoryInDB(place, db);

      db.buyers[canonId] = {
        id: canonId,
        name: name,
        phone: phone,
        place: place,
        nickname: (existing && existing.nickname) || '',
        catKey: matchedCatKey,
        isFav: (existing && existing.isFav) || false
      };

      if (!db.chats[canonId] || db.chats[canonId].length === 0) {
        db.chats[canonId] = [{
          msgId: 'm_welcome_' + phone,
          from: 'shop',
          sender: 'Mumbai Prints',
          text: `Welcome ${name} to the Mumbai Prints Exclusive Digital Catalog! You can chat with us here or browse folders to place orders.`,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          ts: Date.now()
        }];
      }

      currentCustomer = db.buyers[canonId];
      localStorage.setItem(CUST_SESSION_KEY, JSON.stringify(currentCustomer));
      await saveDB();

      if (btn) { btn.innerText = 'Join Now →'; btn.disabled = false; }

      document.getElementById('customerJoinSection').classList.add('hidden');
      document.getElementById('customerMainWorkspace').classList.remove('hidden');
      document.getElementById('customerBottomNav').classList.remove('hidden');
      renderCustomerTab();
    }

    function switchCustomerTab(tab) {
      activeCustTab = tab;
      ['chat', 'folders', 'favorites', 'about'].forEach(t => {
        const btn = document.getElementById('custNav_' + t);
        if (!btn) return;
        btn.className = (t === tab)
          ? 'py-2 px-1 rounded-xl flex flex-col items-center justify-center bg-orange-100 text-mp-maroon font-black text-[11px]'
          : 'py-2 px-1 rounded-xl flex flex-col items-center justify-center text-slate-500 font-bold text-[11px]';
      });
      renderCustomerTab();
    }

    function renderCustomerTab() {
      db = normalizeAndMigrateDB(db);
      const box = document.getElementById('customerMainWorkspace');
      if (!box || !currentCustomer) return;
      box.innerHTML = '';
      const custId = getCanonicalBuyerId(currentCustomer.phone);
      currentCustomer.id = custId;
      const b = db.buyers[custId] || currentCustomer;

      if (!db.folders.includes(selectedCustFolder)) {
        selectedCustFolder = db.folders[0] || 'Ajrakh Print';
      }

      if (activeCustTab === 'chat') {
        const msgs = (db.chats && db.chats[custId]) || [];
        let msgHtml = msgs.map(m => {
          const isMe = m.from === 'cust';
          return `
            <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
              <div class="max-w-[82%] rounded-xl p-2.5 shadow-sm border ${isMe ? 'bg-[#ffeedd] border-orange-200 text-mp-maroon' : 'bg-white border-slate-200 text-slate-900'}">
                <div class="text-[10px] font-bold opacity-75">${m.sender} • ${m.time || ''}</div>
                ${m.productImg ? `<img src="${m.productImg}" class="w-full h-36 object-cover rounded mt-1.5 border"><div class="text-[11px] font-bold mt-1">${m.productTitle || ''}</div>` : ''}
                <div class="text-xs mt-1 font-medium">${m.text}</div>
              </div>
            </div>
          `;
        }).join('');

        box.innerHTML = `
          <div class="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden flex flex-col h-[74vh]">
            <div class="bg-mp-maroon text-white p-3 flex justify-between items-center border-b-2 border-mp-orange">
              <div>
                <h2 class="font-bold text-sm">💬 Mumbai Prints Official Support</h2>
                <p class="text-[10px] text-orange-200">Logged in as: ${b.name} (${b.phone})</p>
              </div>
              <button onclick="switchCustomerTab('folders')" class="bg-mp-orange text-white text-[11px] font-bold px-2.5 py-1 rounded-lg">📂 View Fabrics</button>
            </div>
            <div id="custChatBox" class="flex-1 p-3 overflow-y-auto space-y-2.5 bg-[#f7f1ee] text-xs">${msgHtml}</div>
            <div class="p-2.5 bg-white border-t flex gap-2">
              <input type="text" id="custChatInput" onkeydown="if(event.key==='Enter') sendCustChatMessage()" placeholder="Type a message to Mumbai Prints..." class="flex-1 border-2 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-mp-orange">
              <button onclick="sendCustChatMessage()" class="bg-mp-maroon text-white font-bold px-4 py-2 rounded-xl text-xs">Send</button>
            </div>
          </div>
        `;
        const cb = document.getElementById('custChatBox');
        if (cb) cb.scrollTop = cb.scrollHeight;
      }
      else if (activeCustTab === 'folders') {
        let folderButtons = (db.folders || []).map(f => `
          <button onclick="selectedCustFolder='${f}'; renderCustomerTab();" class="px-3.5 py-2 rounded-xl text-xs font-bold shrink-0 transition ${
            selectedCustFolder === f ? 'bg-mp-maroon text-white shadow' : 'bg-white border border-orange-200 text-mp-maroon'
          }">📁 ${f}</button>
        `).join('');

        const myCat = b.catKey || 'cat1';
        const visibleDesigns = (db.designs || []).filter(d =>
          d.folder === selectedCustFolder && (d.targetCat === 'all' || d.targetCat === myCat)
        );

        let cardsHtml = visibleDesigns.length === 0
          ? `<div class="text-center py-12 text-xs text-slate-400 bg-white rounded-2xl border">No designs uploaded in "${selectedCustFolder}" yet.</div>`
          : visibleDesigns.map(d => {
              const isFav = d.favBy && d.favBy[custId];
              return `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                  <div class="relative">
                    <img src="${d.img}" class="w-full h-56 object-cover bg-slate-100">
                    <button onclick="toggleCustFavoriteDesign(${d.id})" class="absolute top-3 right-3 bg-white/90 hover:bg-white rounded-full px-3 py-1.5 shadow font-bold text-xs flex items-center gap-1">
                      <span>${isFav ? '❤️ Saved' : '🤍 Favorite'}</span>
                    </button>
                  </div>
                  <div class="p-3.5 space-y-2.5">
                    <div class="flex justify-between items-center">
                      <h4 class="font-black text-sm text-mp-maroon">${d.title}</h4>
                      <span class="text-[10px] text-slate-400 font-semibold">${d.dateGroup || ''}</span>
                    </div>
                    <div class="flex gap-2">
                      <input type="text" id="qty_${d.id}" placeholder="Enter Qty (e.g. 20m / 4 sets)..." class="flex-1 border-2 border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-mp-orange">
                      <button onclick="placeCustomerOrder(${d.id})" class="bg-mp-orange hover:bg-orange-600 text-white font-black px-4 py-2 rounded-xl text-xs uppercase shadow">
                        Order Now
                      </button>
                    </div>
                  </div>
                </div>
              `;
            }).join('');

        box.innerHTML = `
          <div class="space-y-3.5">
            <div class="bg-[#fcedea] p-3 rounded-2xl border border-orange-200">
              <h2 class="font-black text-mp-maroon text-xs uppercase mb-2">📂 Select Fabric Folder:</h2>
              <div class="flex gap-2 overflow-x-auto pb-1">${folderButtons}</div>
            </div>
            <div class="space-y-4">${cardsHtml}</div>
          </div>
        `;
      }
      else if (activeCustTab === 'favorites') {
        const favDesigns = (db.designs || []).filter(d => d.favBy && d.favBy[custId]);
        let favHtml = favDesigns.length === 0
          ? `<div class="bg-white rounded-2xl border p-10 text-center text-xs text-slate-400">❤️ You haven't added any designs to Favorite Items yet.<br>Tap the 🤍 Favorite button on any design in Folders to save it here!</div>`
          : favDesigns.map(d => `
              <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <img src="${d.img}" class="w-full h-52 object-cover">
                <div class="p-3.5 space-y-2.5">
                  <div class="flex justify-between items-center">
                    <h4 class="font-black text-sm text-mp-maroon">${d.title}</h4>
                    <button onclick="toggleCustFavoriteDesign(${d.id})" class="text-xs text-red-600 font-bold">❤️ Remove</button>
                  </div>
                  <div class="flex gap-2">
                    <input type="text" id="qty_${d.id}" placeholder="Enter Quantity..." class="flex-1 border-2 rounded-xl px-3 py-2 text-xs">
                    <button onclick="placeCustomerOrder(${d.id})" class="bg-mp-orange text-white font-black px-4 py-2 rounded-xl text-xs uppercase">Order</button>
                  </div>
                </div>
              </div>
            `).join('');

        box.innerHTML = `
          <div class="space-y-3">
            <div class="bg-white p-3.5 rounded-2xl border border-orange-200 flex justify-between items-center">
              <h2 class="font-black text-mp-maroon text-sm uppercase">❤️ Your Favorite Items</h2>
              <span class="bg-orange-100 text-mp-maroon text-xs font-bold px-2.5 py-0.5 rounded-full">${favDesigns.length} Saved</span>
            </div>
            <div class="space-y-4">${favHtml}</div>
          </div>
        `;
      }
      else if (activeCustTab === 'about') {
        const a = db.aboutUs || defaultDB.aboutUs;
        box.innerHTML = `
          <div class="bg-white rounded-2xl shadow-lg border-2 border-orange-200 overflow-hidden">
            <div class="bg-mp-maroon text-white p-6 text-center border-b-4 border-mp-orange">
              <div class="w-16 h-16 bg-white text-mp-maroon font-black text-2xl rounded-2xl mx-auto flex items-center justify-center border-2 border-mp-orange shadow mb-2">MP</div>
              <h2 class="text-xl font-black uppercase tracking-wide">Mumbai Prints</h2>
              <p class="text-xs text-orange-200 tracking-widest uppercase mt-1">QSP is our USP</p>
            </div>
            <div class="p-5 space-y-4 text-xs">
              <div class="space-y-2.5 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <div class="flex items-center justify-between">
                  <span class="font-bold text-slate-600">📞 Primary Phone:</span>
                  <a href="tel:${a.phone1}" class="font-black text-mp-maroon text-sm underline">${a.phone1}</a>
                </div>
                ${a.phone2 && a.phone2 !== 'Add 2nd Number' ? `
                <div class="flex items-center justify-between border-t pt-2">
                  <span class="font-bold text-slate-600">📞 Secondary Phone:</span>
                  <a href="tel:${a.phone2}" class="font-black text-mp-maroon text-sm underline">${a.phone2}</a>
                </div>` : ''}
                <div class="flex items-center justify-between border-t pt-2">
                  <span class="font-bold text-slate-600">✉️ Official Email:</span>
                  <a href="mailto:${a.email}" class="font-bold text-blue-700 underline">${a.email}</a>
                </div>
                <div class="flex items-center justify-between border-t pt-2">
                  <span class="font-bold text-slate-600">📸 Instagram:</span>
                  <a href="${a.instagram || '#'}" target="_blank" class="bg-gradient-to-r from-pink-600 to-orange-500 text-white font-bold px-3 py-1 rounded-lg">Follow on Instagram</a>
                </div>
              </div>

              <div class="bg-[#fcedea] border-2 border-orange-200 rounded-2xl p-4 text-center space-y-1">
                <div class="text-lg">🤝✨</div>
                <p class="text-mp-maroon font-bold text-xs leading-relaxed italic">
                  "${a.message}"
                </p>
              </div>
            </div>
          </div>
        `;
      }
    }

    async function sendCustChatMessage() {
      const input = document.getElementById('custChatInput');
      const text = input ? input.value.trim() : '';
      if (!text || !currentCustomer) return;
      const custId = getCanonicalBuyerId(currentCustomer.phone);
      currentCustomer.id = custId;
      const b = db.buyers[custId] || currentCustomer;
      db.buyers[custId] = b;

      if (!db.chats) db.chats = {};
      if (!db.chats[custId]) db.chats[custId] = [];
      const now = Date.now();
      db.chats[custId].push({
        msgId: 'm_' + now + '_' + Math.floor(Math.random() * 1000),
        from: 'cust',
        sender: b.name,
        text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        ts: now
      });
      input.value = '';
      renderCustomerTab();
      await saveDB();
    }

    async function toggleCustFavoriteDesign(designId) {
      const d = (db.designs || []).find(x => x.id === designId);
      if (!d || !currentCustomer) return;
      if (!d.favBy) d.favBy = {};
      const custId = getCanonicalBuyerId(currentCustomer.phone);
      d.favBy[custId] = !d.favBy[custId];
      renderCustomerTab();
      await saveDB();
    }

    async function placeCustomerOrder(designId) {
      const input = document.getElementById('qty_' + designId);
      const qty = input ? input.value.trim() : '';
      if (!qty) {
        alert('Please enter quantity before ordering!');
        return;
      }
      const d = (db.designs || []).find(x => x.id === designId);
      if (!d || !currentCustomer) return;

      const custId = getCanonicalBuyerId(currentCustomer.phone);
      currentCustomer.id = custId;
      const b = db.buyers[custId] || currentCustomer;
      db.buyers[custId] = b;

      const now = Date.now();
      const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      if (!db.chats) db.chats = {};
      if (!db.chats[custId]) db.chats[custId] = [];
      db.chats[custId].push({
        msgId: 'm_ord_' + now,
        from: 'cust',
        sender: b.name,
        text: `📦 Order Placed — Qty: ${qty}`,
        productImg: d.img,
        productTitle: d.title,
        time: nowStr,
        ts: now
      });

      if (!db.orders) db.orders = [];
      db.orders.unshift({
        id: 'ord_' + now + '_' + Math.floor(Math.random() * 1000),
        buyerId: custId,
        buyerName: b.name,
        buyerPhone: b.phone,
        buyerPlace: b.place,
        designId: d.id,
        designTitle: d.title,
        img: d.img,
        qty: qty,
        time: `Today, ${nowStr}`,
        ts: now
      });

      switchCustomerTab('chat');
      await saveDB();
      alert(`✅ Order for "${d.title}" (${qty}) sent to Mumbai Prints!`);
    }

    function showAddToHomeScreenGuide() {
      alert('📲 Add Mumbai Prints to your Phone Home Screen:\n\n• On Android (Chrome): Tap the 3 dots (⋮) at top-right → Tap "Add to Home screen" or "Install app".\n• On iPhone (Safari): Tap the Share icon (⬆️) at bottom → Scroll down and tap "Add to Home Screen".\n\nIt will open like a full-screen native app without any browser bar!');
    }

    initCustomerApp();
    setInterval(forceCloudPull, 2000);
  </script>
</body>
