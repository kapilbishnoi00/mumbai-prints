<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#68150f">
  <title>Mumbai Prints - Shop Mode (Level 2)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --mp-maroon: #68150f; --mp-maroon-dark: #4e0e09; --mp-orange: #eb4d26; --mp-bg: #fdf8f6; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--mp-bg); }
    .bg-mp-maroon { background-color: var(--mp-maroon); }
    .bg-mp-maroon-dark { background-color: var(--mp-maroon-dark); }
    .bg-mp-orange { background-color: var(--mp-orange); }
    .text-mp-maroon { color: var(--mp-maroon); }
    .text-mp-orange { color: var(--mp-orange); }
    .border-mp-orange { border-color: var(--mp-orange); }
  </style>
</head>
<body class="min-h-screen pb-24 text-slate-800">

  <!-- SHOP LOGIN SCREEN -->
  <section id="shopLoginSection" class="max-w-md mx-auto mt-16 p-4">
    <div class="bg-white rounded-2xl shadow-xl border-2 border-orange-200 overflow-hidden">
      <div class="bg-mp-maroon text-white p-6 text-center border-b-4 border-mp-orange">
        <div class="w-14 h-14 bg-white text-mp-maroon font-black text-2xl rounded-xl mx-auto flex items-center justify-center border-2 border-mp-orange shadow mb-2">MP</div>
        <h2 class="text-xl font-black uppercase tracking-wide">Mumbai Prints</h2>
        <p class="text-xs text-orange-200 tracking-widest uppercase mt-0.5">🏪 Shop Mode Login (Level 2)</p>
      </div>
      <div class="p-6 space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 uppercase mb-1">Staff Username</label>
          <input type="text" id="shopUser" placeholder="Enter Username" class="w-full border-2 border-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:border-mp-orange">
        </div>
        <div>
          <label class="block font-bold text-slate-700 uppercase mb-1">Staff Password</label>
          <input type="password" id="shopPass" onkeydown="if(event.key==='Enter') handleShopLogin()" placeholder="Enter Password" class="w-full border-2 border-slate-200 rounded-lg p-2.5 text-sm focus:outline-none focus:border-mp-orange">
        </div>
        <button onclick="handleShopLogin()" class="w-full bg-mp-maroon hover:bg-mp-maroon-dark text-white font-black py-3 rounded-xl shadow-md text-sm uppercase tracking-wider">
          Login to Shop Feed →
        </button>
      </div>
    </div>
  </section>

  <!-- SHOP MAIN APP -->
  <div id="shopMainApp" class="hidden">
    <header class="bg-mp-maroon text-white shadow-md border-b-4 border-mp-orange sticky top-0 z-40">
      <div class="max-w-4xl mx-auto p-3.5 flex justify-between items-center">
        <div class="flex items-center gap-2.5">
          <div class="bg-white text-mp-maroon font-black text-lg px-2 py-0.5 rounded border-2 border-mp-orange">MP</div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-lg font-black uppercase leading-none">Mumbai Prints</h1>
              <span id="shopSyncBadge" class="text-[9px] bg-green-900/90 border border-green-400 text-green-200 px-2 py-0.5 rounded-full font-bold">🟢 Synced</span>
            </div>
            <p class="text-[10px] text-orange-200 uppercase tracking-widest mt-0.5">🏪 Shop Mode • QSP is our USP</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="toggleStudioModal()" class="bg-mp-orange hover:bg-orange-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow">📤 Upload & Folders</button>
          <button onclick="shopLogout()" class="bg-mp-maroon-dark text-orange-200 text-xs font-bold px-2.5 py-1.5 rounded-lg border border-orange-800">Logout</button>
        </div>
      </div>
    </header>

    <main class="max-w-4xl mx-auto p-3.5" id="shopDynamicView"></main>

    <!-- 3-TAB BOTTOM NAVIGATION BAR -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-orange-200 shadow-2xl z-40">
      <div class="max-w-md mx-auto grid grid-cols-3 gap-1 p-1.5 text-center">
        <button onclick="switchShopBottomTab('categories')" id="shopNav_categories" class="py-2 px-1 rounded-xl flex flex-col items-center justify-center bg-orange-100 text-mp-maroon font-black text-xs">
          <span class="text-lg leading-none mb-0.5">🗂️</span>
          <span>Category List</span>
        </button>
        <button onclick="switchShopBottomTab('orders')" id="shopNav_orders" class="py-2 px-1 rounded-xl flex flex-col items-center justify-center text-slate-500 font-bold text-xs">
          <span class="text-lg leading-none mb-0.5">📦</span>
          <span>Order List (<span id="shopOrdBadge">0</span>)</span>
        </button>
        <button onclick="switchShopBottomTab('favorites')" id="shopNav_favorites" class="py-2 px-1 rounded-xl flex flex-col items-center justify-center text-slate-500 font-bold text-xs">
          <span class="text-lg leading-none mb-0.5">⭐</span>
          <span>Fav Customers</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- MODAL: BULK UPLOAD, FOLDERS & SENT PHOTOS CONTROL -->
  <div id="shopStudioModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3 overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-2xl w-full p-4 shadow-2xl border-2 border-mp-orange space-y-4 my-8 max-h-[90vh] overflow-y-auto text-xs">
      <div class="flex justify-between items-center border-b pb-2 sticky top-0 bg-white z-10">
        <h3 class="text-base font-black text-mp-maroon uppercase">📤 Upload Photos, Folders & Manage Sent Designs</h3>
        <button onclick="toggleStudioModal()" class="text-slate-500 font-bold text-lg px-2">✕</button>
      </div>

      <div class="bg-[#fcedea] p-3 rounded-xl border border-orange-200 space-y-2">
        <div class="flex justify-between items-center">
          <span class="font-bold text-mp-maroon uppercase">📂 Fabric Folders Control (Add / Rename / Delete)</span>
          <button onclick="shopAddFolder()" class="bg-mp-orange text-white font-bold px-2.5 py-1 rounded">+ New Folder</button>
        </div>
        <div id="shopFoldersChips" class="flex flex-wrap gap-1.5"></div>
      </div>

      <div class="border-2 border-orange-200 rounded-xl p-3 space-y-3">
        <div class="flex justify-between items-center">
          <span class="font-bold text-mp-maroon text-sm">🚀 Bulk Photo Upload</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <div>
            <label class="font-bold block mb-1">1. Select Folder</label>
            <select id="shopUpFolder" class="w-full border rounded p-2 font-semibold"></select>
          </div>
          <div>
            <label class="font-bold block mb-1">2. Target Category</label>
            <select id="shopUpCat" class="w-full border rounded p-2 bg-orange-50 text-mp-maroon font-bold"></select>
          </div>
          <div>
            <label class="font-bold block mb-1">3. Design Prefix</label>
            <input type="text" id="shopUpPrefix" placeholder="e.g. New Arrival" class="w-full border rounded p-2">
          </div>
          <div>
            <label class="font-bold block mb-1">4. Select Photos</label>
            <input type="file" id="shopUpFiles" multiple accept="image/*" class="w-full text-xs">
          </div>
        </div>
        <button id="shopUploadBtn" onclick="shopSubmitUpload()" class="w-full bg-mp-maroon text-white font-bold py-2.5 rounded-lg uppercase">Upload & Send Now</button>
      </div>

      <div class="space-y-2">
        <h4 class="font-bold text-mp-maroon uppercase">🖼️ Manage Sent Photos (Edit / Delete)</h4>
        <div id="shopSentPhotosList" class="space-y-2 max-h-60 overflow-y-auto"></div>
      </div>
    </div>
  </div>

  <!-- MODAL: ADD BUYER WITH TARGET CATEGORY & 1-CLICK INVITE -->
  <div id="shopAddBuyerModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl border-2 border-mp-orange space-y-3.5 text-xs">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-base font-black text-mp-maroon uppercase">➕ Add Buyer (SMS & WhatsApp Invite)</h3>
        <button onclick="document.getElementById('shopAddBuyerModal').classList.add('hidden')" class="text-slate-400 font-bold text-lg">✕</button>
      </div>
      <div>
        <label class="block font-bold mb-1">1. Select Category *</label>
        <select id="sNewCatSelect" onchange="syncShopModalPlace()" class="w-full border-2 border-orange-300 bg-orange-50 text-mp-maroon font-bold rounded-lg p-2.5 text-sm"></select>
      </div>
      <div>
        <label class="block font-bold mb-1">2. Customer / Shop Name *</label>
        <input type="text" id="sNewName" placeholder="XYZ Textile" class="w-full border-2 rounded-lg p-2.5 text-sm">
      </div>
      <div>
        <label class="block font-bold mb-1">3. Mobile Number (10 Digits) *</label>
        <input type="tel" id="sNewPhone" placeholder="9876543210" class="w-full border-2 rounded-lg p-2.5 text-sm">
      </div>
      <div>
        <label class="block font-bold mb-1">4. Place / Location *</label>
        <input type="text" id="sNewPlace" placeholder="Ernakulam" class="w-full border-2 rounded-lg p-2.5 text-sm">
      </div>
      <button onclick="shopConfirmAddBuyer()" class="w-full bg-mp-maroon text-white font-black py-3 rounded-xl uppercase shadow">Add Buyer & Create Invite Link</button>
      <div id="sSmsBox" class="hidden bg-green-50 border-2 border-green-300 rounded-xl p-3.5 space-y-2.5"></div>
    </div>
  </div>

  <!-- UNIFIED MASTER V3 ENGINE -->
  <script>
    const FB_URL = "https://mumbai-prints-default-rtdb.firebaseio.com/mp_cloud_db_2026/v3_state.json";
    const STORAGE_KEY = "mp_v3_master_db";
    const AUTH_KEY = "mp_shop_autologin_v3";

    const defaultDB = {
      updatedAt: 1,
      deletedIds: {},
      folders: ['Ajrakh Print', 'DJ Material', '3D Print', 'DCM', '320 Cut', '3 Meter Cut'],
      categories: {
        cat1: { id: 'cat1', name: 'Category 1', place: 'Ernakulam', buyerIds: ['b_9847011223'] },
        cat2: { id: 'cat2', name: 'Category 2', place: 'Tamil Nadu', buyerIds: ['b_9840055667'] },
        cat3: { id: 'cat3', name: 'Category 3', place: 'Kottayam', buyerIds: ['b_9447088990'] },
        cat4: { id: 'cat4', name: 'Category 4', place: 'Alappuzha', buyerIds: ['b_9446033441'] },
        catX: { id: 'catX', name: 'Category X', place: 'Other Places', buyerIds: [] }
      },
      buyers: {
        b_9847011223: { id: 'b_9847011223', name: 'Kochi Fashion Hub', phone: '9847011223', place: 'Ernakulam', nickname: 'Salim (Kochi)', catKey: 'cat1', isFav: true },
        b_9840055667: { id: 'b_9840055667', name: 'Chennai Silks', phone: '9840055667', place: 'Tamil Nadu', nickname: 'Murugan', catKey: 'cat2', isFav: false },
        b_9447088990: { id: 'b_9447088990', name: 'Kottayam Textorium', phone: '9447088990', place: 'Kottayam', nickname: 'Thomas', catKey: 'cat3', isFav: true },
        b_9446033441: { id: 'b_9446033441', name: 'Alleppey Collections', phone: '9446033441', place: 'Alappuzha', nickname: 'Anil', catKey: 'cat4', isFav: false }
      },
      chats: {
        b_9847011223: [
          { id: 'm_init_1', ts: 1, from: 'shop', sender: 'Mumbai Prints', text: 'Welcome to Mumbai Prints Exclusive Digital Catalog!', time: '10:00 AM' }
        ]
      },
      orders: [],
      designs: [
        { id: 101, folder: 'Ajrakh Print', title: 'Ajrakh Pure Cotton #1', dateGroup: 'Today — 29 Oct 2026', targetCat: 'all', targetLabel: 'All Categories', img: 'https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=500&q=80', favBy: {} }
      ],
      aboutUs: {
        phone1: '8893173438',
        phone2: '',
        email: 'mumbaiprint18@gmail.com',
        instagram: 'https://instagram.com/mumbaiprints',
        message: 'Thank you so much for showing your trust in us. We will always stand by your side to support you. Thank you so much!'
      }
    };

    function loadLocalDB() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return JSON.parse(JSON.stringify(defaultDB));
    }

    let db = loadLocalDB();
    let currentShopTab = 'categories';
    let drillStep = 'cat_list';
    let selectedCatKey = 'cat1';
    let selectedBuyerId = 'b_9847011223';

    let isSavingToCloud = false;
    let hasInitialCloudPullCompleted = false;
    let pendingPush = false;

    function setSyncBadge(state) {
      const el = document.getElementById('shopSyncBadge');
      if (!el) return;
      if (state === 'syncing') {
        el.className = "text-[9px] bg-amber-500 text-slate-950 px-2 py-0.5 rounded-full font-bold";
        el.innerText = "⏳ Saving...";
      } else if (state === 'error') {
        el.className = "text-[9px] bg-red-700 text-white px-2 py-0.5 rounded-full font-bold";
        el.innerText = "⚠️ Offline";
      } else {
        el.className = "text-[9px] bg-green-900/90 border border-green-400 text-green-200 px-2 py-0.5 rounded-full font-bold";
        el.innerText = "🟢 Synced";
      }
    }

    function safeSaveLocal(dataObj) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(dataObj));
      } catch (e) {
        if (dataObj.designs && dataObj.designs.length > 15) {
          dataObj.designs = dataObj.designs.slice(0, 15);
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(dataObj)); } catch (err) {}
        }
      }
    }

    function normalizeDB(d) {
      if (!d || typeof d !== 'object') return JSON.parse(JSON.stringify(defaultDB));
      if (!d.deletedIds) d.deletedIds = {};
      if (!d.buyers) d.buyers = {};
      if (!d.categories) d.categories = JSON.parse(JSON.stringify(defaultDB.categories));
      if (!d.chats) d.chats = {};
      if (!d.orders) d.orders = [];
      if (!d.folders || d.folders.length === 0) d.folders = [...defaultDB.folders];
      if (!d.designs) d.designs = [];
      if (!d.aboutUs) d.aboutUs = { ...defaultDB.aboutUs };

      const idMap = {};
      const cleanBuyers = {};
      Object.values(d.buyers).forEach(b => {
        if (!b || !b.phone) return;
        const cleanPhone = String(b.phone).replace(/\D/g, '').slice(-10);
        if (cleanPhone.length !== 10) return;
        const normId = 'b_' + cleanPhone;
        if (d.deletedIds[normId] || d.deletedIds[b.id]) return;
        idMap[b.id] = normId;
        cleanBuyers[normId] = {
          ...b,
          id: normId,
          phone: cleanPhone,
          catKey: (b.catKey && d.categories[b.catKey]) ? b.catKey : 'cat1'
        };
      });
      d.buyers = cleanBuyers;

      const cleanChats = {};
      Object.keys(d.chats).forEach(oldKey => {
        const normKey = idMap[oldKey] || (oldKey.startsWith('b_') ? oldKey : null);
        if (!normKey || d.deletedIds[normKey]) return;
        if (!cleanChats[normKey]) cleanChats[normKey] = [];
        (d.chats[oldKey] || []).forEach((m, idx) => {
          if (!m) return;
          if (!m.id) m.id = 'm_' + (m.ts || idx) + '_' + String(m.text || '').slice(0, 8).replace(/\W/g, '');
          if (!m.ts) m.ts = idx + 1;
          cleanChats[normKey].push(m);
        });
      });
      d.chats = cleanChats;

      Object.keys(d.categories).forEach(catKey => {
        const cat = d.categories[catKey];
        cat.buyerIds = Array.from(new Set(
          (cat.buyerIds || []).map(id => idMap[id] || id).filter(id => d.buyers[id] && d.buyers[id].catKey === catKey)
        ));
      });
      Object.values(d.buyers).forEach(b => {
        const ck = (b.catKey && d.categories[b.catKey]) ? b.catKey : 'cat1';
        b.catKey = ck;
        if (!d.categories[ck].buyerIds.includes(b.id)) {
          d.categories[ck].buyerIds.unshift(b.id);
        }
      });

      d.orders = (d.orders || []).filter(o => o && !d.deletedIds[o.id]).map(o => ({
        ...o,
        buyerId: idMap[o.buyerId] || o.buyerId
      }));

      return d;
    }

    function mergeDatabases(localDB, cloudDB) {
      if (!localDB) return normalizeDB(cloudDB);
      if (!cloudDB) return normalizeDB(localDB);

      const l = normalizeDB(JSON.parse(JSON.stringify(localDB)));
      const c = normalizeDB(JSON.parse(JSON.stringify(cloudDB)));
      const merged = JSON.parse(JSON.stringify(c));

      merged.updatedAt = Math.max(l.updatedAt || 0, c.updatedAt || 0);
      merged.deletedIds = { ...(c.deletedIds || {}), ...(l.deletedIds || {}) };

      merged.folders = Array.from(new Set([...(c.folders || []), ...(l.folders || [])]))
        .filter(f => !merged.deletedIds['folder_' + f]);

      merged.categories = { ...(c.categories || {}), ...(l.categories || {}) };

      merged.buyers = { ...(c.buyers || {}), ...(l.buyers || {}) };
      Object.keys(merged.buyers).forEach(id => {
        if (merged.deletedIds[id]) {
          delete merged.buyers[id];
        } else if (c.buyers[id] && l.buyers[id]) {
          merged.buyers[id] = (l.buyers[id].updatedAt || 0) >= (c.buyers[id].updatedAt || 0)
            ? l.buyers[id]
            : c.buyers[id];
        }
      });

      merged.chats = {};
      const allChatBuyerIds = new Set([...Object.keys(c.chats || {}), ...Object.keys(l.chats || {})]);
      allChatBuyerIds.forEach(bId => {
        if (merged.deletedIds[bId]) return;
        const msgMap = new Map();
        [...(c.chats[bId] || []), ...(l.chats[bId] || [])].forEach((m, i) => {
          if (!m) return;
          const mId = m.id || ('m_' + (m.ts || i) + '_' + m.from + '_' + m.text);
          msgMap.set(mId, { ...m, id: mId });
        });
        merged.chats[bId] = Array.from(msgMap.values()).sort((a, b) => (a.ts || 0) - (b.ts || 0));
      });

      const ordMap = new Map();
      [...(c.orders || []), ...(l.orders || [])].forEach(o => {
        if (o && o.id && !merged.deletedIds[o.id]) {
          ordMap.set(String(o.id), o);
        }
      });
      merged.orders = Array.from(ordMap.values()).sort((a, b) => (b.ts || 0) - (a.ts || 0));

      const desMap = new Map();
      [...(c.designs || []), ...(l.designs || [])].forEach(d => {
        if (d && d.id && !merged.deletedIds['des_' + d.id]) {
          const existing = desMap.get(String(d.id));
          if (existing) {
            d.favBy = { ...(existing.favBy || {}), ...(d.favBy || {}) };
          }
          desMap.set(String(d.id), d);
        }
      });
      merged.designs = Array.from(desMap.values());

      return normalizeDB(merged);
    }

    async function saveAndSyncNow() {
      db.updatedAt = Date.now();
      db = normalizeDB(db);
      safeSaveLocal(db);

      if (!hasInitialCloudPullCompleted) {
        pendingPush = true;
        return;
      }
      if (isSavingToCloud) {
        pendingPush = true;
        return;
      }

      isSavingToCloud = true;
      setSyncBadge('syncing');
      try {
        const res = await fetch(FB_URL + "?t=" + Date.now(), { cache: "no-store" });
        if (res.ok) {
          const cloudData = await res.json();
          if (cloudData && typeof cloudData === 'object') {
            db = mergeDatabases(db, cloudData);
            safeSaveLocal(db);
          }
        }
        await fetch(FB_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(db)
        });
        setSyncBadge('synced');
      } catch (e) {
        setSyncBadge('error');
      } finally {
        isSavingToCloud = false;
        if (pendingPush) {
          pendingPush = false;
          setTimeout(saveAndSyncNow, 150);
        }
      }
    }

    function playNotificationSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1174.66, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.35, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.45);
      } catch (e) {}
    }

    function navigateToTarget(action) {
      if (!action) return;
      if (action.type === "order") {
        switchShopBottomTab("orders");
      } else if (action.type === "chat" && action.buyerId) {
        if (db.buyers[action.buyerId]) {
          selectedCatKey = db.buyers[action.buyerId].catKey || "cat1";
        }
        selectedBuyerId = action.buyerId;
        currentShopTab = "categories";
        drillStep = "chat_view";
        renderShopView();
      }
    }

    function showSmartNotification(title, body, action) {
      playNotificationSound();
      if ("Notification" in window && Notification.permission === "granted") {
        try {
          const sysNotif = new Notification(title, { body: body });
          sysNotif.onclick = function() { window.focus(); navigateToTarget(action); this.close(); };
        } catch (e) {}
      }
      const toast = document.createElement("div");
      toast.style.cssText = "position:fixed;top:16px;right:16px;background:#68150f;color:#fff;padding:14px 18px;border-radius:12px;box-shadow:0 8px 25px rgba(0,0,0,0.4);z-index:999999;font-family:sans-serif;font-size:13px;max-width:320px;border:2px solid #ffcc00;cursor:pointer;";
      toast.innerHTML = `
        <div style="font-weight:bold;font-size:14px;color:#ffcc00;margin-bottom:4px;">🔔 ${title}</div>
        <div style="font-size:12px;line-height:1.4;">${body}</div>
        <div style="font-size:10px;color:#ffd54f;margin-top:6px;font-weight:bold;text-transform:uppercase;">👉 Tap here to open directly</div>
      `;
      toast.onclick = function() { navigateToTarget(action); toast.remove(); };
      document.body.appendChild(toast);
      setTimeout(() => { if (toast.parentNode) toast.remove(); }, 7000);
    }

    function detectChangesAndNotify(oldDB, newDB) {
      if (!oldDB || !newDB) return;
      const oldOrderIds = new Set((oldDB.orders || []).map(o => String(o.id)));
      const newOrders = (newDB.orders || []).filter(o => !oldOrderIds.has(String(o.id)));
      if (newOrders.length > 0) {
        const latestOrder = newOrders[0];
        const buyer = (newDB.buyers && newDB.buyers[latestOrder.buyerId]) || { name: latestOrder.buyerName || "Customer" };
        showSmartNotification(
          `New Order from ${buyer.nickname || buyer.name}!`,
          `📦 ${latestOrder.designTitle} — Qty: ${latestOrder.qty}`,
          { type: "order", buyerId: latestOrder.buyerId }
        );
        return;
      }

      const oldBuyerIds = new Set(Object.keys(oldDB.buyers || {}));
      const newBuyerIds = Object.keys(newDB.buyers || {}).filter(id => !oldBuyerIds.has(id));
      if (newBuyerIds.length === 1) {
        const nb = newDB.buyers[newBuyerIds[0]];
        showSmartNotification(
          `New Buyer Joined: ${nb.name}`,
          `📍 Place: ${nb.place} • 📞 ${nb.phone}`,
          { type: "chat", buyerId: nb.id }
        );
      }

      const oldChats = oldDB.chats || {};
      const newChats = newDB.chats || {};
      for (const bId of Object.keys(newChats)) {
        const oldList = oldChats[bId] || [];
        const newList = newChats[bId] || [];
        if (newList.length > oldList.length) {
          const lastMsg = newList[newList.length - 1];
          const buyer = (newDB.buyers && newDB.buyers[bId]) || { name: lastMsg.sender || "Customer" };
          if (lastMsg.from !== "shop") {
            showSmartNotification(
              `Message from ${buyer.nickname || buyer.name}`,
              `💬 "${lastMsg.text}"`,
              { type: "chat", buyerId: bId }
            );
            return;
          }
        }
      }
    }

    async function pullFromCloudNow() {
      if (isSavingToCloud) return;
      try {
        const res = await fetch(FB_URL + "?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) return;
        const cloudData = await res.json();

        if (!cloudData || typeof cloudData !== "object") {
          hasInitialCloudPullCompleted = true;
          await saveAndSyncNow();
          return;
        }

        const oldSnapshot = JSON.parse(JSON.stringify(db));
        const merged = mergeDatabases(db, cloudData);

        if (hasInitialCloudPullCompleted) {
          detectChangesAndNotify(oldSnapshot, merged);
        }

        const changed = JSON.stringify(merged) !== JSON.stringify(db);
        const cloudNeedsUpdate = JSON.stringify(merged) !== JSON.stringify(normalizeDB(cloudData));

        db = merged;
        safeSaveLocal(db);
        hasInitialCloudPullCompleted = true;

        const activeEl = document.activeElement;
        const isTyping = activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA" || activeEl.tagName === "SELECT");
        if (changed && !isTyping) {
          renderShopView();
        }

        if (cloudNeedsUpdate || pendingPush) {
          pendingPush = false;
          await saveAndSyncNow();
        }
      } catch (e) {}
    }

    function buildInviteLinks(name, phone, place, catKey) {
      const cleanName = name || 'Valued Partner';
      const cleanPlace = place || 'Ernakulam';
      const cleanCat = catKey || selectedCatKey || 'cat1';
      const digitsOnly = String(phone || '').replace(/\D/g, '').slice(-10);
      const waPhone = (digitsOnly.length === 10) ? '91' + digitsOnly : digitsOnly;
      const baseUrl = window.location.origin + window.location.pathname.replace(/admin\.html|shop\.html/i, 'customer.html');
      const inviteLink = `${baseUrl}?invite=1&phone=${encodeURIComponent(digitsOnly)}&name=${encodeURIComponent(cleanName)}&place=${encodeURIComponent(cleanPlace)}&cat=${encodeURIComponent(cleanCat)}`;
      const waMsg = `Hello *${cleanName}*,\n\nWelcome to the *Mumbai Prints* Exclusive Digital Catalog! 🌟\n\nExplore our latest textile collections, view new designs, and place your orders directly using the link below:\n👉 ${inviteLink}\n\n🔑 *Your Login Mobile Number:* ${digitsOnly}\n\nThank you,\n*Team Mumbai Prints*`;
      const smsText = waMsg.replace(/\*/g, '');
      const waUrl = `https://wa.me/${waPhone}?text=${encodeURIComponent(waMsg)}`;
      const smsUrl = `sms:+91${digitsOnly}?body=${encodeURIComponent(smsText)}`;
      return { inviteLink, smsText, waUrl, smsUrl };
    }

    function addBuyerToDatabase(name, phone, place, targetCatKey) {
      const cleanPhone = String(phone || '').replace(/\D/g, '').slice(-10);
      if (cleanPhone.length !== 10) return null;
      const cleanName = (name || 'Buyer').trim();
      const cleanPlace = (place || 'Ernakulam').trim();
      const buyerId = 'b_' + cleanPhone;

      let catKey = targetCatKey;
      if (!catKey || !db.categories[catKey]) {
        catKey = 'catX';
        Object.keys(db.categories).forEach(k => {
          if (k !== 'catX' && db.categories[k].place.toLowerCase() === cleanPlace.toLowerCase()) {
            catKey = k;
          }
        });
      }
      if (!db.categories[catKey]) catKey = Object.keys(db.categories)[0] || 'cat1';

      delete db.deletedIds[buyerId];

      db.buyers[buyerId] = {
        id: buyerId,
        name: cleanName,
        phone: cleanPhone,
        place: cleanPlace,
        nickname: db.buyers[buyerId]?.nickname || '',
        catKey: catKey,
        isFav: db.buyers[buyerId]?.isFav || false,
        updatedAt: Date.now()
      };

      Object.keys(db.categories).forEach(k => {
        db.categories[k].buyerIds = (db.categories[k].buyerIds || []).filter(id => id !== buyerId);
      });
      db.categories[catKey].buyerIds.unshift(buyerId);

      if (!db.chats[buyerId] || db.chats[buyerId].length === 0) {
        db.chats[buyerId] = [{
          id: 'm_welcome_' + cleanPhone,
          ts: Date.now(),
          from: 'shop',
          sender: 'Mumbai Prints',
          text: `Welcome ${cleanName}! You have been added to the Mumbai Prints Exclusive Digital Catalog.`,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }];
      }

      return { buyerId, catKey };
    }

    function shopToggleFav(id) {
      if (!db.buyers[id]) return;
      db.buyers[id].isFav = !db.buyers[id].isFav;
      db.buyers[id].updatedAt = Date.now();
      renderShopView();
      saveAndSyncNow();
    }

    function shopShiftBuyer(id, newCatKey) {
      const b = db.buyers[id];
      if (!b || b.catKey === newCatKey) return;
      db.categories[b.catKey].buyerIds = (db.categories[b.catKey].buyerIds || []).filter(x => x !== id);
      db.categories[newCatKey].buyerIds.unshift(id);
      b.catKey = newCatKey;
      b.updatedAt = Date.now();
      renderShopView();
      saveAndSyncNow();
      alert(`Shifted ${b.name} to ${db.categories[newCatKey].name}!`);
    }

    function shopRemoveBuyer(id) {
      const b = db.buyers[id];
      if (!b) return;
      if (confirm(`Remove ${b.name}?`)) {
        db.deletedIds[id] = true;
        if (db.categories[b.catKey]) {
          db.categories[b.catKey].buyerIds = db.categories[b.catKey].buyerIds.filter(x => x !== id);
        }
        delete db.buyers[id];
        renderShopView();
        saveAndSyncNow();
      }
    }

    function shopSendChat() {
      const input = document.getElementById('shopChatIn');
      const text = input ? input.value.trim() : '';
      if (!text || !selectedBuyerId) return;
      if (!db.chats[selectedBuyerId]) db.chats[selectedBuyerId] = [];
      const nowTs = Date.now();
      db.chats[selectedBuyerId].push({
        id: 'm_' + nowTs + '_' + Math.floor(Math.random() * 1000),
        ts: nowTs,
        from: 'shop',
        sender: 'Mumbai Prints (Shop)',
        text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });
      input.value = '';
      renderShopView();
      saveAndSyncNow();
    }

            <button onclick="shopDeletePhoto(${d.id})" class="bg-red-100 text-red-700 px-2 py-1 rounded font-bold">🗑️ Delete</button>
          </div>
        </div>
      `).join('');
    }

    function shopAddFolder() {
      const n = prompt('New Fabric Folder Name:');
      if (n && n.trim()) {
        const clean = n.trim();
        delete db.deletedIds['folder_' + clean];
        if (!db.folders.includes(clean)) db.folders.push(clean);
        renderStudioModalContent();
        saveAndSyncNow();
      }
    }

    function shopRenameFolder(oldN) {
      const newN = prompt('Rename Folder:', oldN);
      if (newN && newN.trim()) {
        const clean = newN.trim();
        db.deletedIds['folder_' + oldN] = true;
        delete db.deletedIds['folder_' + clean];
        db.folders = db.folders.map(f => f === oldN ? clean : f);
        db.designs.forEach(d => { if (d.folder === oldN) d.folder = clean; });
        renderStudioModalContent();
        saveAndSyncNow();
      }
    }

    function shopDeleteFolder(fName) {
      if (confirm(`Delete folder "${fName}"?`)) {
        db.deletedIds['folder_' + fName] = true;
        db.folders = db.folders.filter(f => f !== fName);
        renderStudioModalContent();
        saveAndSyncNow();
      }
    }

    function compressImageFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxW = 750;
            const scale = img.width > maxW ? maxW / img.width : 1;
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.65));
          };
          img.onerror = () => resolve(e.target.result);
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function shopSubmitUpload() {
      const folder = document.getElementById('shopUpFolder').value;
      const targetCat = document.getElementById('shopUpCat').value;
      const targetLabel = document.getElementById('shopUpCat').selectedOptions[0].text;
      const prefix = document.getElementById('shopUpPrefix').value.trim() || `${folder} Design`;
      const files = document.getElementById('shopUpFiles').files;
      if (!files || files.length === 0) { alert('Select at least 1 photo!'); return; }

      const btn = document.getElementById('shopUploadBtn');
      btn.innerText = '⏳ Compressing & Uploading...';
      btn.disabled = true;

      for (let i = 0; i < files.length; i++) {
        const compressed = await compressImageFile(files[i]);
        db.designs.unshift({
          id: Date.now() + i,
          folder,
          title: `${prefix} #${i + 1}`,
          dateGroup: 'Today — 29 Oct 2026',
          targetCat,
          targetLabel,
          img: compressed,
          favBy: {}
        });
      }

      renderStudioModalContent();
      await saveAndSyncNow();
      btn.innerText = 'Upload & Send Now';
      btn.disabled = false;
      alert(`${files.length} photos uploaded successfully!`);
    }

    function shopEditPhoto(id) {
      const d = db.designs.find(x => x.id === id);
      if (!d) return;
      const t = prompt('Edit Design Title:', d.title);
      if (t && t.trim()) {
        d.title = t.trim();
        renderStudioModalContent();
        saveAndSyncNow();
      }
    }

    function shopDeletePhoto(id) {
      if (confirm('Delete this sent photo?')) {
        db.deletedIds['des_' + id] = true;
        db.designs = db.designs.filter(x => x.id !== id);
        renderStudioModalContent();
        saveAndSyncNow();
      }
    }

    function syncShopModalPlace() {
      const catId = document.getElementById('sNewCatSelect').value;
      if (db.categories[catId]) {
        document.getElementById('sNewPlace').value = db.categories[catId].place;
      }
    }

    function openShopAddBuyer() {
      const catSel = document.getElementById('sNewCatSelect');
      catSel.innerHTML = Object.values(db.categories).map(c =>
        `<option value="${c.id}" ${c.id === selectedCatKey ? 'selected' : ''}>${c.name} (${c.place})</option>`
      ).join('');
      document.getElementById('sNewName').value = '';
      document.getElementById('sNewPhone').value = '';
      document.getElementById('sNewPlace').value = db.categories[selectedCatKey]?.place || '';
      document.getElementById('sSmsBox').classList.add('hidden');
      document.getElementById('shopAddBuyerModal').classList.remove('hidden');
    }

    async function shopConfirmAddBuyer() {
      const chosenCat = document.getElementById('sNewCatSelect').value;
      const name = document.getElementById('sNewName').value.trim();
      const phone = document.getElementById('sNewPhone').value.trim();
      const place = document.getElementById('sNewPlace').value.trim();
      if (!name || !phone || !place) {
        alert('Please enter Name, 10-Digit Mobile Number, and Place!');
        return;
      }

      const res = addBuyerToDatabase(name, phone, place, chosenCat);
      if (!res) {
        alert('Please enter a valid 10-digit mobile number!');
        return;
      }

      selectedCatKey = res.catKey;
      selectedBuyerId = res.buyerId;
      renderShopView();
      saveAndSyncNow();

      const inv = buildInviteLinks(name, phone, place, res.catKey);
      const box = document.getElementById('sSmsBox');
      box.classList.remove('hidden');
      box.innerHTML = `
        <div class="font-bold text-green-900">✅ Added to ${db.categories[res.catKey].name} (${db.categories[res.catKey].place})!</div>
        <div class="text-[11px] bg-white p-2.5 rounded border border-green-200 whitespace-pre-line">${inv.smsText}</div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
          <a href="${inv.smsUrl}" class="bg-blue-600 text-white text-center font-bold py-2.5 rounded-xl shadow">📲 1. Send Free SIM SMS</a>
          <a href="${inv.waUrl}" target="_blank" class="bg-green-600 text-white text-center font-bold py-2.5 rounded-xl shadow">🟢 2. WhatsApp 1-Click Invite</a>
        </div>
        <button onclick="navigator.clipboard.writeText('${inv.inviteLink}'); alert('Invite link copied!');" class="w-full bg-slate-800 text-white font-bold py-2 rounded-xl mt-1">📋 Copy Invite Link</button>
      `;
    }

    // Floating Bulk Buyer Upload Modal
    (function setupBulkBuyerModal() {
      const bulkBtn = document.createElement("button");
      bulkBtn.innerHTML = "📋 + Bulk Add Buyers";
      bulkBtn.style.cssText = "position:fixed;bottom:75px;right:20px;background:#68150f;color:#fff;border:2px solid #ffcc00;padding:12px 18px;border-radius:50px;font-weight:bold;font-size:13px;cursor:pointer;z-index:99998;box-shadow:0 6px 20px rgba(0,0,0,0.35);font-family:sans-serif;";
      document.body.appendChild(bulkBtn);

      const modal = document.createElement("div");
      modal.style.cssText = "display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:99999;align-items:center;justify-content:center;padding:16px;font-family:sans-serif;";
      modal.innerHTML = `
        <div style="background:#fff;width:100%;max-width:560px;border-radius:14px;padding:22px;max-height:88vh;overflow-y:auto;box-shadow:0 12px 35px rgba(0,0,0,0.4);">
          <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #f0f0f0;padding-bottom:12px;margin-bottom:14px;">
            <h3 style="margin:0;color:#68150f;font-size:17px;">📋 Bulk Add Buyers & WhatsApp Invite</h3>
            <button id="mpBulkClose" style="background:none;border:none;font-size:24px;cursor:pointer;color:#666;line-height:1;">&times;</button>
          </div>
          <div style="margin-bottom:12px;">
            <label style="font-size:12px;font-weight:bold;color:#333;display:block;margin-bottom:5px;">1. Select Target Category for Bulk Buyers</label>
            <select id="mpBulkCatSelect" style="width:100%;padding:9px;border:2px solid #eb4d26;border-radius:8px;font-size:13px;font-weight:bold;color:#68150f;background:#fff8f6;"></select>
          </div>
          <div style="margin-bottom:12px;">
            <label style="font-size:12px;font-weight:bold;color:#333;display:block;margin-bottom:5px;">2. Option A: Upload CSV / Text File</label>
            <input type="file" id="mpCsvInput" accept=".csv,.txt" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:12px;background:#fafafa;" />
          </div>
          <div style="margin-bottom:14px;">
            <label style="font-size:12px;font-weight:bold;color:#333;display:block;margin-bottom:5px;">Option B: Paste Contact List (One contact per line)</label>
            <div style="font-size:11px;color:#666;margin-bottom:5px;">Format: <b>Shop Name, 10-Digit Mobile, City</b> (Or simply paste 10-digit mobile numbers)</div>
            <textarea id="mpBulkTextarea" rows="5" placeholder="Raju Textiles, 9876543210, Ernakulam&#10;Kochi Silks, 9123456789, Kochi&#10;8891173438" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-family:monospace;font-size:12px;box-sizing:border-box;"></textarea>
          </div>
          <button id="mpProcessBulkBtn" style="width:100%;background:#68150f;color:#fff;border:none;padding:13px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:14px;">
            ⚡ ADD ALL BUYERS & GENERATE WHATSAPP LINKS
          </button>
          <div id="mpBulkQueueArea" style="margin-top:16px;display:none;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
              <h4 style="margin:0;color:#1b5e20;font-size:14px;">✅ Buyers Saved to Cloud! Click 'Send' one-by-one:</h4>
              <span id="mpBulkCountBadge" style="background:#e8f5e9;color:#1b5e20;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:bold;"></span>
            </div>
            <div id="mpBulkListContainer" style="max-height:240px;overflow-y:auto;border:1px solid #e0e0e0;border-radius:8px;padding:8px;background:#fafafa;"></div>
          </div>
        </div>
      `;
      document.body.appendChild(modal);

      bulkBtn.onclick = () => {
        const sel = document.getElementById("mpBulkCatSelect");
        sel.innerHTML = Object.values(db.categories || {}).map(c =>
          `<option value="${c.id}" ${c.id === selectedCatKey ? "selected" : ""}>${c.name} (${c.place})</option>`
        ).join("");
        modal.style.display = "flex";
      };
      document.getElementById("mpBulkClose").onclick = () => { modal.style.display = "none"; };

      document.getElementById("mpCsvInput").addEventListener("change", function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) { document.getElementById("mpBulkTextarea").value = evt.target.result; };
        reader.readAsText(file);
      });

      document.getElementById("mpProcessBulkBtn").addEventListener("click", async function() {
        const raw = document.getElementById("mpBulkTextarea").value.trim();
        if (!raw) { alert("Please paste contact numbers or upload a CSV file first!"); return; }
        const chosenCatKey = document.getElementById("mpBulkCatSelect").value;
        const defaultPlace = db.categories?.[chosenCatKey]?.place || "Ernakulam";
        const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        const parsedContacts = [];

        lines.forEach((line, idx) => {
          const parts = line.split(/[,\t;]+/).map(s => s.trim()).filter(Boolean);
          let name = "", phone = "", place = defaultPlace;
          parts.forEach(p => {
            const digits = p.replace(/\D/g, "");
            if (digits.length >= 10 && !phone) phone = digits.slice(-10);
            else if (!name) name = p;
            else place = p;
          });
          if (phone && phone.length === 10) {
            if (!name) name = "Buyer " + (idx + 1);
            parsedContacts.push({ name, phone, place });
          }
        });

        if (parsedContacts.length === 0) { alert("No valid 10-digit mobile numbers found!"); return; }

        const btn = document.getElementById("mpProcessBulkBtn");
        btn.innerText = "⏳ Saving All Buyers to Cloud...";
        btn.disabled = true;

        const listContainer = document.getElementById("mpBulkListContainer");
        listContainer.innerHTML = "";
        document.getElementById("mpBulkQueueArea").style.display = "block";
        document.getElementById("mpBulkCountBadge").innerText = parsedContacts.length + " Buyers Added";

        parsedContacts.forEach((c, i) => {
          addBuyerToDatabase(c.name, c.phone, c.place, chosenCatKey);
          const inv = buildInviteLinks(c.name, c.phone, c.place, chosenCatKey);
          const row = document.createElement("div");
          row.style.cssText = "display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid #eee;background:#fff;border-radius:6px;margin-bottom:6px;";
          row.innerHTML = `
            <div style="font-size:12px;">
              <b style="color:#222;">${i + 1}. ${c.name}</b> <span style="color:#666;">(${c.place})</span><br>
              <span style="color:#68150f;font-family:monospace;font-size:12px;">📞 ${c.phone}</span>
            </div>
            <a href="${inv.waUrl}" target="_blank" class="mp-wa-send-btn" style="background:#25D366;color:#fff;text-decoration:none;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:bold;white-space:nowrap;">
              📲 Send WhatsApp
            </a>
          `;
          row.querySelector(".mp-wa-send-btn").addEventListener("click", function() {
            this.style.background = "#9e9e9e";
            this.innerText = "✓ Sent";
          });
          listContainer.appendChild(row);
        });

        selectedCatKey = chosenCatKey;
        renderShopView();
        await saveAndSyncNow();

        btn.innerText = "✅ ALL BUYERS SAVED TO CLOUD!";
        setTimeout(() => {
          btn.innerText = "⚡ ADD ALL BUYERS & GENERATE WHATSAPP LINKS";
          btn.disabled = false;
        }, 2500);
      });
    })();

    if ("Notification" in window && Notification.permission === "default") {
      document.addEventListener("click", function reqPerm() {
        Notification.requestPermission();
        document.removeEventListener("click", reqPerm);
      }, { once: true });
    }

    initShopApp();
    pullFromCloudNow();
    setInterval(pullFromCloudNow, 2000);
  </script>
</body>
